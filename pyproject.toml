[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ftrec"
version = "0.1.0"
description = "Conflict-aware pretraining and low-rank adaptation experiments for sequential recommendation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pyarrow>=14",
  "PyYAML>=6",
  "torch>=2.9,<2.14",
  "tqdm>=4.66",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ftrec-preprocess = "ftrec.cli.preprocess:main"
ftrec-import-gmflowrec = "ftrec.cli.import_gmflowrec:main"
ftrec-pretrain = "ftrec.cli.pretrain:main"
ftrec-adapt = "ftrec.cli.adapt:main"
ftrec-analyze = "ftrec.cli.analyze:main"
ftrec-pilot = "ftrec.cli.pilot:main"
ftrec-smoke = "ftrec.cli.smoke:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
